<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbf7ed" />
    <meta name="robots" content="noindex" />
    <title>Email confirmed · Little Lift</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #2f302a; background: #fbf7ed; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); padding: 42px 32px; border: 1px solid #e6ddce; border-radius: 28px; background: #fffdf8; box-shadow: 0 18px 50px rgba(72,55,40,.08); }
      .brand { margin: 0 0 54px; font-family: Georgia, serif; font-size: 26px; }
      .heart { width: 64px; height: 64px; display: grid; place-items: center; margin-bottom: 24px; border-radius: 50%; background: #f7ded4; color: #cf5d49; font-size: 32px; }
      h1 { margin: 0 0 16px; font-family: Georgia, serif; font-size: clamp(38px,8vw,54px); font-weight: 400; line-height: 1.06; }
      p { margin: 0; color: #6f6b62; font-size: 17px; line-height: 1.65; }
      .note { margin-top: 28px; padding-top: 24px; border-top: 1px solid #e6ddce; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Little Lift</p>
      <div class="heart" aria-hidden="true">♡</div>
      <h1>Your email is confirmed.</h1>
      <p>Return to Little Lift and sign in. Your private space is ready when you are.</p>
      <p class="note">You can safely close this page.</p>
    </main>
  </body>
</html>
